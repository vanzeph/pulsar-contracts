name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: typecheck + purity + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Typecheck (mypy strict)
        run: python -m mypy

      - name: Import purity check (runtime)
        run: |
          python - <<'PY'
          import sys

          import pulsar_contracts

          forbidden = {
              "akshare", "baostock", "xtquant", "tushare", "rqdata", "jqdatasdk",
              "requests", "httpx", "aiohttp", "urllib3",
              "pulsar_core", "pulsar_data", "pulsar_exec", "pulsar_app", "pulsar_ui",
          }
          loaded = forbidden.intersection(sys.modules)
          assert not loaded, f"forbidden modules imported by pulsar-contracts: {sorted(loaded)}"
          print(f"import purity OK (pulsar-contracts {pulsar_contracts.__version__})")
          PY

      - name: Tests (pytest)
        run: python -m pytest

  install:
    name: pip installability smoke check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install from source (non-editable)
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Smoke import of the public surface
        run: |
          python -c "import pulsar_contracts as pc; \
                     assert pc.MarketDataPort and pc.ExecutionPort; \
                     assert pc.Instrument and pc.OrderIntent and pc.ExecutionEvent; \
                     print('install ok', pc.__version__)"

  topology-gate:
    name: cross-repo topology gate (tools)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --upgrade pip pytest

      - name: Topology gate unit tests (legal / illegal fixtures)
        run: python -m pytest tools/tests

      - name: Topology self-check (pulsar-contracts)
        run: python tools/check_topology.py --repo .
